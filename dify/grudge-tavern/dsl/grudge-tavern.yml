    - data:
        type: code
        title: 誊抄账本
        code_language: python3
        code: "KIND_CN = {\"debt\": \"赊账\", \"prank\": \"恶作剧\", \"promise\": \"许诺\", \"insult\": \"顶撞\",\n           \"favor\"\
          : \"人情\", \"gift\": \"礼物\", \"preference\": \"口味\"}\nWEIGHT = {\"debt\": 3, \"prank\": 2, \"insult\": 2, \"promise\"\
          : 1, \"preference\": 0, \"favor\": -2, \"gift\": -3}\n\nimport json\n\n\ndef _entries(body: str, status_code: float,\
          \ key: str) -> list:\n    try:\n        if 200 <= int(status_code) < 300:\n            return json.loads(body or\
          \ \"{}\").get(key, []) or []\n    except Exception:\n        pass\n    return []\n\n\ndef main(player: str, online:\
          \ str, active_body: str, active_status: float,\n         forgotten_body: str, forgotten_status: float) -> dict:\n\
          \    if online != \"yes\":\n        return {\"text\": \"（老焦翻遍柜台也没找到小本本——PowerContext 暂时连不上，稍后再来查账。）\"}\n    active\
          \ = _entries(active_body, active_status, \"entries\")\n    forgotten = _entries(forgotten_body, forgotten_status,\
          \ \"items\")\n    score = sum(WEIGHT.get(e.get(\"kind\", \"\"), 0) for e in active)\n    lines = [f\"【老焦的小本本 · {player}】当前记仇值\
          \ {score}\", \"\", \"未了的账：\"]\n    if active:\n        for e in active:\n            aid = e.get(\"artifact\", {}).get(\"\
          artifact_id\", \"\")\n            lines.append(f\"- [{KIND_CN.get(e.get('kind'), e.get('kind'))}] {e.get('text')}（{aid}）\"\
          )\n    else:\n        lines.append(\"- 干干净净，一笔没有\")\n    lines += [\"\", \"已一笔勾销：\"]\n    if forgotten:\n      \
          \  for e in forgotten:\n            aid = e.get(\"artifact\", {}).get(\"artifact_id\", \"\")\n            lines.append(f\"\
          - ~~[{KIND_CN.get(e.get('kind'), e.get('kind'))}] {e.get('text')}~~（{aid}）\")\n    else:\n        lines.append(\"\
          - 暂无\")\n    return {\"text\": \"\\n\".join(lines)}\n"
        variables:
        - variable: player
          value_selector:
          - prep_scope
          - player
          value_type: string
        - variable: online
          value_selector:
          - read_scope
          - online
          value_type: string
        - variable: active_body
