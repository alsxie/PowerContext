    - data:
        type: code
        title: 账本摘要
        code_language: python3
        code: "KIND_CN = {\"debt\": \"赊账\", \"prank\": \"恶作剧\", \"promise\": \"许诺\", \"insult\": \"顶撞\",\n           \"favor\"\
          : \"人情\", \"gift\": \"礼物\", \"preference\": \"口味\"}\nWEIGHT = {\"debt\": 3, \"prank\": 2, \"insult\": 2, \"promise\"\
          : 1, \"preference\": 0, \"favor\": -2, \"gift\": -3}\n\nimport json\n\n\ndef main(body: str, status_code: float)\
          \ -> dict:\n    entries = []\n    try:\n        if 200 <= int(status_code) < 300:\n            entries = json.loads(body\
          \ or \"{}\").get(\"entries\", []) or []\n    except Exception:\n        entries = []\n    items = []\n    for index,\
          \ entry in enumerate(entries[:50], start=1):\n        items.append({\n            \"label\": f\"L{index}\",\n  \
          \          \"artifact\": entry.get(\"artifact\"),\n            \"state_version\": entry.get(\"state_version\", 0),\n\
          \            \"kind\": entry.get(\"kind\", \"\"),\n            \"text\": entry.get(\"text\", \"\"),\n        })\n\
          \    lines = [f\"{it['label']} [{KIND_CN.get(it['kind'], it['kind'])}] {it['text']}\" for it in items]\n    return\
          \ {\n        \"ledger_text\": \"\\n\".join(lines) if lines else \"（小本本上还没有这个人的记录）\",\n        \"ledger_json\": json.dumps(items,\
          \ ensure_ascii=False),\n    }\n"
        variables:
        - variable: body
          value_selector:
          - list_ledger
          - body
          value_type: string
        - variable: status_code
          value_selector:
          - list_ledger
          - status_code
          value_type: number
        outputs:
