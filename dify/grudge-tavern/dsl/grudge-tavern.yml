    - data:
        type: code
        title: 定账：检索词 / 新账 / 勾销 / 记仇值
        code_language: python3
        code: "KIND_CN = {\"debt\": \"赊账\", \"prank\": \"恶作剧\", \"promise\": \"许诺\", \"insult\": \"顶撞\",\n           \"favor\"\
          : \"人情\", \"gift\": \"礼物\", \"preference\": \"口味\"}\nWEIGHT = {\"debt\": 3, \"prank\": 2, \"insult\": 2, \"promise\"\
          : 1, \"preference\": 0, \"favor\": -2, \"gift\": -3}\n\nimport json\nimport re\n\nMOODS = [(0, \"眉开眼笑\"), (3, \"\
          爱答不理\"), (6, \"阴阳怪气\"), (9, \"拍桌子瞪眼\")]\n\n\ndef _parse(text: str) -> dict:\n    text = re.sub(r\"<think>.*?</think>\"\
          , \"\", text or \"\", flags=re.S)\n    match = re.search(r\"\\{.*\\}\", text, flags=re.S)\n    if not match:\n \
          \       return {}\n    try:\n        value = json.loads(match.group(0))\n    except Exception:\n        return {}\n\
          \    return value if isinstance(value, dict) else {}\n\n\ndef _mood(score: int) -> str:\n    for upper, name in\
          \ MOODS:\n        if score <= upper:\n            return name\n    return \"抄起擀面杖\"\n\n\ndef main(think_text: str,\
          \ ledger_json: str, scope_id: str, player: str) -> dict:\n    ledger = json.loads(ledger_json or \"[]\")\n    by_label\
          \ = {item[\"label\"]: item for item in ledger}\n    plan = _parse(think_text)\n\n    keywords = []\n    for word\
          \ in plan.get(\"keywords\", []) if isinstance(plan.get(\"keywords\"), list) else []:\n        word = str(word).strip()[:8]\n\
          \        if word and word not in keywords:\n            keywords.append(word)\n    keywords = keywords[:4]\n\n \
          \   known = {\" \".join(item[\"text\"].split()) for item in ledger}\n    events = []\n    for event in plan.get(\"\
          new_events\", []) if isinstance(plan.get(\"new_events\"), list) else []:\n        if not isinstance(event, dict):\n\
          \            continue\n        kind = str(event.get(\"kind\", \"\")).strip()\n        text = \" \".join(str(event.get(\"\
          text\", \"\")).split())[:120]\n        if kind in KIND_CN and text and text not in known:\n            known.add(text)\n\
          \            events.append({\"kind\": kind, \"text\": text})\n    events = events[:3]\n\n    settled = []\n    for\
          \ label in plan.get(\"settle\", []) if isinstance(plan.get(\"settle\"), list) else []:\n        item = by_label.get(str(label).strip())\n\
          \        if item and item[\"kind\"] in (\"debt\", \"prank\", \"promise\", \"insult\") and item not in settled:\n\
          \            settled.append(item)\n\n    settled_ids = {item[\"artifact\"][\"artifact_id\"] for item in settled}\n\
          \    score = sum(WEIGHT.get(item[\"kind\"], 0) for item in ledger\n                if item[\"artifact\"][\"artifact_id\"\
          ] not in settled_ids)\n    score += sum(WEIGHT.get(event[\"kind\"], 0) for event in events)\n\n    online = bool(scope_id)\n\
          \    recall_bodies = [json.dumps({\"scope_id\": scope_id, \"query\": word, \"limit\": 3}, ensure_ascii=False)\n\
          \                     for word in keywords] if online else []\n    remember_bodies = [json.dumps({\"scope_id\":\
          \ scope_id, \"kind\": event[\"kind\"], \"text\": event[\"text\"],\n                                   \"reason\"\
          : f\"旅人「{player}」在酒馆里亲口说的\"}, ensure_ascii=False)\n                       for event in events] if online else []\n\
          \    forget_bodies = [json.dumps({\"scope_id\": scope_id,\n                                 \"target\": {\"artifact\"\
          : item[\"artifact\"], \"state_version\": item[\"state_version\"]},\n                                 \"state\":\
          \ \"forgotten\"}, ensure_ascii=False)\n                     for item in settled] if online else []\n\n    return\
          \ {\n        \"keywords\": keywords,\n        \"recall_bodies\": recall_bodies,\n        \"remember_bodies\": remember_bodies,\n\
          \        \"forget_bodies\": forget_bodies,\n        \"grudge\": score,\n        \"mood\": _mood(score),\n      \
          \  \"events_text\": \"\\n\".join(f\"- [{KIND_CN[e['kind']]}] {e['text']}\" for e in events) or \"（无）\",\n      \
          \  \"settle_text\": \"\\n\".join(f\"- [{KIND_CN[i['kind']]}] {i['text']}\" for i in settled) or \"（无）\",\n    }\n"
        variables:
        - variable: think_text
          value_selector:
          - think
          - text
          value_type: string
        - variable: ledger_json
          value_selector:
          - ledger_digest
          - ledger_json
