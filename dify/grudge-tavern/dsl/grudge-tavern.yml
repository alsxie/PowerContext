        code_language: python3
        code: "KIND_CN = {\"debt\": \"赊账\", \"prank\": \"恶作剧\", \"promise\": \"许诺\", \"insult\": \"顶撞\",\n           \"favor\"\
          : \"人情\", \"gift\": \"礼物\", \"preference\": \"口味\"}\nWEIGHT = {\"debt\": 3, \"prank\": 2, \"insult\": 2, \"promise\"\
          : 1, \"preference\": 0, \"favor\": -2, \"gift\": -3}\n\nimport json\n\n\ndef _records(results: list) -> list:\n\
          \    records = []\n    for raw in results or []:\n        try:\n            records += json.loads(raw or \"{}\"\
          ).get(\"records\", []) or []\n        except Exception:\n            continue\n    return records\n\n\ndef main(online:\
          \ str, remembered: list, forgotten: list, recall_ids: list, keywords_text: str,\n         grudge: float, mood: str)\
          \ -> dict:\n    if online != \"yes\":\n        return {\"text\": \"\\n\\n---\\n【小本本】PowerContext 暂时连不上，本轮没有记账。\"\
          }\n    lines = [\"\", \"\", \"---\", f\"【小本本】记仇值 {int(grudge)}（脸色：{mood}）· 检索词：{keywords_text}\"]\n    if recall_ids:\n\
          \        lines.append(\"翻出旧账：\" + \"、\".join(recall_ids))\n    for record in _records(remembered):\n        artifact_id\
          \ = record.get(\"artifact\", {}).get(\"artifact_id\", \"\")\n        lines.append(f\"新记一笔：[{KIND_CN.get(record.get('kind'),\
          \ record.get('kind'))}] {record.get('text')}（{artifact_id}）\")\n    for record in _records(forgotten):\n       \
          \ artifact_id = record.get(\"artifact\", {}).get(\"artifact_id\", \"\")\n        lines.append(f\"一笔勾销：[{KIND_CN.get(record.get('kind'),\
          \ record.get('kind'))}] {record.get('text')}（{artifact_id}）\")\n    return {\"text\": \"\\n\".join(lines)}\n"
        variables:
        - variable: online
          value_selector:
          - read_scope
          - online
          value_type: string
        - variable: remembered
          value_selector:
          - remember
          - output
          value_type: array[string]
