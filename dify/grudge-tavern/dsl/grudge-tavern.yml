        code_language: python3
        code: "KIND_CN = {\"debt\": \"赊账\", \"prank\": \"恶作剧\", \"promise\": \"许诺\", \"insult\": \"顶撞\",\n           \"favor\"\
          : \"人情\", \"gift\": \"礼物\", \"preference\": \"口味\"}\nWEIGHT = {\"debt\": 3, \"prank\": 2, \"insult\": 2, \"promise\"\
          : 1, \"preference\": 0, \"favor\": -2, \"gift\": -3}\n\nimport json\n\n\ndef main(results: list, keywords: list)\
          \ -> dict:\n    seen, lines, ids = set(), [], []\n    for raw in results or []:\n        try:\n            hits\
          \ = json.loads(raw or \"{}\").get(\"hits\", []) or []\n        except Exception:\n            hits = []\n      \
          \  for hit in hits:\n            memory = hit.get(\"memory\", {})\n            artifact_id = memory.get(\"artifact\"\
          , {}).get(\"artifact_id\", \"\")\n            if not artifact_id or artifact_id in seen:\n                continue\n\
          \            seen.add(artifact_id)\n            ids.append(artifact_id)\n            lines.append(f\"- [{KIND_CN.get(memory.get('kind'),\
          \ memory.get('kind'))}] {memory.get('text')}\")\n    return {\n        \"recall_text\": \"\\n\".join(lines[:6])\
          \ or \"（这句话没勾起什么旧账）\",\n        \"recall_ids\": ids[:6],\n        \"keywords_text\": \"、\".join(keywords or [])\
          \ or \"（无）\",\n    }\n"
        variables:
